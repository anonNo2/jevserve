[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "jevserve"
version = "0.1.0.dev0"
description = "Typed decision serving contracts for Jev-style models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["pydantic==2.14.1", "fastapi==0.136.3", "uvicorn==0.54.0", "httpx==0.28.1", "prometheus-client==0.26.0"]

[project.scripts]
jevserve = "jevserve.cli:main"

[project.entry-points."vllm.general_plugins"]
jevserve = "jevserve.runtime.registration:register"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "typesafe-sdk==0.7.4", "ruff==0.17.0", "mypy==2.4.0", "build==1.6.1", "hatchling==1.30.1"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["gpu: requires real NVIDIA inference", "container: requires Docker", "release: release certification gate"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jevserve"]

# GPU dependencies stay out of CPU protocol tests. Their APIs are verified by
# the separately pinned engine environment and real GPU validation.
[[tool.mypy.overrides]]
module = ["vllm.*", "torch.*", "safetensors.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jevserve.runtime.model"]
# vLLM builds this model's base class dynamically; mypy cannot resolve it.
ignore_errors = true
